<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # The OOP application code, templates, and runtime cache are never
    # served directly - only reachable through index.php.
    <Directory /var/www/html/app>
        Require all denied
    </Directory>
    <Directory /var/www/html/templates>
        Require all denied
    </Directory>
    <Directory /var/www/html/storage>
        Require all denied
    </Directory>
    <Directory /var/www/html/docker>
        Require all denied
    </Directory>

    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
    </Files>

    RewriteEngine On

    # /sitemap.xml is generated by the front controller from the exported
    # tree. It has to be claimed before the static-asset rule below, which
    # would otherwise hand the .xml extension straight to Apache and 404.
    RewriteRule ^sitemap\.xml$ index.php [L]

    # Real static asset directories are served directly by Apache.
    RewriteCond %{REQUEST_URI} ^/(wp-content|wp-json|images)/ [NC]
    RewriteRule ^ - [L]

    # Any other static asset file (css/js/images/fonts/feeds/...) is also
    # served directly, wherever it lives in the legacy content tree.
    RewriteCond %{REQUEST_URI} \.(css|js|mjs|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|otf|xml|txt|json|pdf|mp4|zip)$ [NC]
    RewriteRule ^ - [L]

    # Everything else is a page request: hand it to the OOP front
    # controller, which wraps the matching legacy content in the single
    # shared header/footer template.
    RewriteRule ^ index.php [L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # The OOP application code, templates, and runtime cache are never
    # served directly - only reachable through index.php.
    <Directory /var/www/html/app>
        Require all denied
    </Directory>
    <Directory /var/www/html/templates>
        Require all denied
    </Directory>
    <Directory /var/www/html/storage>
        Require all denied
    </Directory>
    <Directory /var/www/html/docker>
        Require all denied
    </Directory>
    <Directory /var/www/html/bin>
        Require all denied
    </Directory>

    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
    </Files>

    RewriteEngine On

    # /sitemap.xml and /robots.txt are generated by the front controller.
    # Both have to be claimed before the static-asset rule below, which
    # would otherwise hand the .xml/.txt extension straight to Apache and
    # 404 - there is no file by either name in the tree.
    #
    # In a <VirtualHost> (unlike .htaccess) the pattern is matched against
    # the full URL path, leading slash included. These rules used to read
    # "^sitemap\.xml$", which never matched "/sitemap.xml" - so both URLs
    # fell through to the static-file rule and 404ed in production.
    RewriteRule ^/sitemap\.xml$ /index.php [L]
    RewriteRule ^/robots\.txt$ /index.php [L]

    # Real static asset directories are served directly by Apache.
    RewriteCond %{REQUEST_URI} ^/(wp-content|wp-json|images)/ [NC]
    RewriteRule ^ - [L]

    # Any other static asset file (css/js/images/fonts/feeds/...) is also
    # served directly, wherever it lives in the legacy content tree.
    RewriteCond %{REQUEST_URI} \.(css|js|mjs|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|otf|xml|txt|json|pdf|mp4|zip)$ [NC]
    RewriteRule ^ - [L]

    # Everything else is a page request: hand it to the OOP front
    # controller, which wraps the matching legacy content in the single
    # shared header/footer template.
    RewriteRule ^ index.php [L]

    # Long-lived caching for static files. Site stylesheets and scripts are
    # requested with a ?v=<mtime> stamp (see $asset in templates/header.php),
    # so a changed file is fetched fresh regardless.
    <IfModule mod_headers.c>
        <FilesMatch "\.(css|js|mjs|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot|otf)$">
            Header set Cache-Control "public, max-age=2592000"
        </FilesMatch>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/xml application/rss+xml application/javascript application/json image/svg+xml
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
